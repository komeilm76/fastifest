name: Windows path safety

on:
  push:
    branches:
      - arena/ef1b019c-fastifest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-path-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-path-safety:
    name: Windows · Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun for lockfile installation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run path and reparse-point tests
        run: node ./node_modules/vitest/vitest.mjs run tests/config.test.ts tests/managed.test.ts
