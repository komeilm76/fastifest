name: Runtime compatibility candidates

on:
  push:
    branches:
      - arena/ef1b019c-fastifest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-compatibility-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-candidate-matrix:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun for lockfile installation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Run full checks under Node
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build
          node dist/cli.js --help
          node dist/cli.js --version
      - name: Verify npm package contents
        if: matrix.node-version == 24
        run: npm run package:check

  bun-linux-candidate:
    name: ubuntu-26.04 · Bun 1.4.4 candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Run full checks under Bun
        run: bun run check

      - name: Verify npm package contents
        run: npm run package:check

  minimum-node-packed-install:
    name: ${{ matrix.os }} · Node 20.10.0 packed-install candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js at the candidate floor
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.10.0

      - name: Set up Bun for lockfile installation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install development dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed package and CLI on the candidate floor
        env:
          FASTIFEST_EXPECTED_NODE: 20.10.0
        run: node scripts/verify-minimum-node-runtime.mjs
