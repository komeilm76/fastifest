name: Runtime compatibility candidates

on:
  push:
    branches:
      - arena/ef1b019c-fastifest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-compatibility-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-matrix:
    name: ${{ matrix.os }} · ${{ matrix.runtime.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime:
          - name: Node 20
            kind: node
            version: "20"
          - name: Node 22
            kind: node
            version: "22"
          - name: Bun 1.4.4
            kind: bun
            version: "1.4.4"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: matrix.runtime.kind == 'node'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.runtime.version }}

      - name: Set up Bun for lockfile installation and Bun candidate
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Run full checks under Node
        if: matrix.runtime.kind == 'node'
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build
          node dist/cli.js --help
          node dist/cli.js --version

      - name: Run full checks under Bun
        if: matrix.runtime.kind == 'bun'
        run: bun run check
